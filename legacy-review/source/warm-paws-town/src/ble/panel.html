<section id="ble-local-entry" class="shell" aria-label="本地蓝牙测试">
  <button id="ble-local-open" type="button" class="secondary-button" aria-haspopup="dialog">BLE 本地测试 v1</button>
</section>
<dialog id="ble-local-dialog" aria-labelledby="ble-local-title" aria-describedby="ble-local-warning">
  <div class="dialog-inner">
    <header class="dialog-header"><h2 id="ble-local-title">BLE 本地测试 v1</h2><button type="button" class="close-button" aria-label="关闭蓝牙测试">×</button></header>
    <p id="ble-local-warning" class="dialog-copy">仅供本地设备测试。连接、HELLO 与 MAC 不代表账号认证或设备绑定；不修改原游戏与存档。离开前台或关闭面板会断开。</p>
    <p id="ble-local-status" role="status" aria-live="polite">尚未连接。</p>
    <p id="ble-local-error" class="dialog-error" role="alert"></p>
    <div class="reset-actions"><button id="ble-local-permissions" type="button" class="secondary-button">请求蓝牙权限</button><button id="ble-local-scan" type="button" class="secondary-button" disabled>扫描 8 秒</button><button id="ble-local-stop" type="button" class="secondary-button" disabled>停止扫描</button></div>
    <label class="field-label" for="ble-local-device">发现的本地 v1 设备</label><select id="ble-local-device" class="name-input" disabled><option value="">暂无设备，请先扫描。</option></select>
    <div class="reset-actions"><button id="ble-local-connect" type="button" class="secondary-button" disabled>连接并握手</button><button id="ble-local-disconnect" type="button" class="secondary-button">断开并停止重连</button></div>
    <p class="dialog-copy">最多 3 次前台重连；重连后 HELLO + GET_STATE 修复状态。命令超时不会自动重发，变更结果可能未知。</p>
    <div class="reset-actions"><button id="ble-local-state" type="button" class="secondary-button" disabled>GET_STATE</button><button id="ble-local-start" type="button" class="secondary-button" disabled>START_LOCAL</button></div>
    <label class="field-label" for="ble-local-ping">PING 文本（UTF-8 最多 10 字节）</label><input id="ble-local-ping" class="name-input" value="ping" maxlength="10"><button id="ble-local-send-ping" type="button" class="secondary-button" disabled>发送 PING</button>
    <label class="field-label" for="ble-local-face">设备表情</label><select id="ble-local-face" class="name-input"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select><button id="ble-local-send-face" type="button" class="secondary-button" disabled>SET_FACE</button>
    <h3>设备状态（只读）</h3><pre id="ble-local-readout" tabindex="0" aria-label="设备身份及状态">尚未收到设备状态。</pre>
  </div>
</dialog>
