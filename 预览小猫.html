  <div class="shell">
    <header class="masthead">
      <a class="brand" href="#" aria-label="橘白小猫动画预览">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M4 4h7v5h10V4h7v19h-5v5H9v-5H4z"/><path fill="var(--paper)" d="M9 14h4v4H9zm10 0h4v4h-4zm-5 7h4v3h-4z"/></svg>
        <span class="brand-title">动画小剧场<span class="brand-en">PIXEL CAT STUDIO</span></span>
      </a>
      <div class="downloads">
        <button class="download" id="download-model" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>下载模型</button>
        <button class="download" id="download-texture" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 17 6-6 4 4 3-3 5 5"/><circle cx="16" cy="8" r="1"/></svg>下载贴图</button>
      </div>
    </header>
    <main>
      <section class="hero" aria-label="橘白小猫模型预览">
        <div class="intro">
          <div class="eyebrow"><span class="eyebrow-dot"></span>橘白 · 像素小猫</div>
          <h1>小方块，<br>有点可爱。</h1>
          <p>看它慢慢走两步，<br>再伸出小爪子，打个招呼。</p>
          <div class="character-note">一只小猫，三段小动作</div>
        </div>
        <div class="stage" id="stage">
          <div id="stage-view" class="stage-view"></div>
          <div class="stage-badge" aria-hidden="true">ORANGE &amp; WHITE<br>ANIMATION STUDY</div>

        </div>
      </section>
      <section class="control-deck" aria-label="动画控制">
        <div class="controls-left">
          <div class="animations" role="group" aria-label="选择动画">
            <button class="animation" type="button" data-animation="idle" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><path d="M5 10V4l5 4h4l5-4v6c2 2 2 7 0 9-4 3-10 3-14 0-2-2-2-7 0-9z"/><path d="M8 13h1m6 0h1m-6 4 2 1 2-1" stroke-linecap="round"/></svg>待机</button>
            <button class="animation" type="button" data-animation="walk" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><path d="M6 9h10l3 4v5h-3v-3H9v3H6v-5H3V7m13 2V4l4 3v6" stroke-linejoin="round"/></svg>走路</button>
            <button class="animation" type="button" data-animation="paw" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><ellipse cx="7" cy="7" rx="2" ry="2.8"/><ellipse cx="13" cy="5.5" rx="2" ry="2.8"/><ellipse cx="19" cy="8.5" rx="2" ry="2.8"/><path d="M7 15c1-4 4-5 7-3l4 4c2 4-3 5-6 4-5 2-8 0-5-5z"/></svg>挥爪</button>
          </div>
          <label class="timeline"><input id="timeline" type="range" min="0" max="2" step="0.001" value="0" aria-label="当前动画时间"><span class="time-label" id="time-label">0.0 / 2.0s</span></label>
        </div>
        <div class="transport">
          <button class="tool" id="play" type="button" aria-label="暂停动画" title="暂停动画"><svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg></button>
          <button class="tool" id="rotate" type="button" aria-label="自动旋转视角" title="自动旋转视角" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><path d="M20 9a8 8 0 1 0 .2 6M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="tool" id="reset-view" type="button" aria-label="恢复正面视角" title="恢复正面视角"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><path d="m3 10 9-7 9 7M6 9v12h12V9M10 21v-7h4v7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </section>
    </main>
    <footer class="footer"><p>模型与动画可在 Blockbench 中继续编辑。</p><p class="status"><span class="status-dot"></span>离线也能看</p></footer>
  </div>
